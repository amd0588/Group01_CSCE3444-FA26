<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>DSExplorer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
        <!-- The semantic navigation container -->
            <nav class="main-navigation">

                <div class="logo">MyWebsite</div>
                <ul>
                    <li><button>Data Structures</button></li>
                    <li>
                        <select id="speed" name="speed">
                            <option value="1x">Speed 1x</option>
                            <option value="2x">Speed 2x</option>
                        </select>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="visualizer">
                <h2 id="data-structure">Linked List</h2>

                <div class="visualizer-layout">
                    <div class="stage" id="stage">
                    <!-- boxes get added here by JS -->
                    </div>

                    <aside class="code-panel">
                        <pre><code id="code">function add(arr, value) {
                            arr.push(value);
                        }

                        function remove(arr) {
                        return arr.pop();
                        }</code></pre>
                    </aside>
                </div>

                <div class="action">
                    <button id="play" class="action-button">Play</button>
                    <button id="iterate" class="action-button">Iterate</button>
                </div>

                <div class="controls">
                    <ul>
                        <li><input type="text" id="value" name="value" placeholder="Enter value e.g. 30"> <button id="add" class="action-button">Add element</button></li>
                        <li><input type="text" id="value" name="value" placeholder="Enter value e.g. 30"> <button id="remove" class="action-button">Remove element</button></li>
                    </ul>

                    <div class="refresh">
                        <button id="refresh" class="action-button">Refresh</button>
                    </div>                    
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
